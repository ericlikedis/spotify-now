<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spotify-now color picker</title>
<style>
  :root { color-scheme: dark; }
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; background: #161616; color: #eee;
         max-width: 34rem; margin: 3rem auto; padding: 0 1.25rem; }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  p.sub { margin: 0 0 1.75rem; color: #999; }
  .row { display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem; }
  input[type=color] { width: 4.5rem; height: 3rem; padding: 0; border: 1px solid #444;
                      border-radius: 8px; background: none; cursor: pointer; }
  input[type=text] { font: 1rem ui-monospace, Menlo, monospace; width: 8rem; padding: .5rem .6rem;
                     background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; }
  input[type=text].bad { border-color: #e5484d; }
  .preview { background: #000; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem;
             font: 1rem ui-monospace, Menlo, monospace; }
  .pill { display: inline-block; padding: .15rem .9rem; border-radius: 999px; }
  .swatches { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .swatches button { width: 2rem; height: 2rem; border-radius: 50%; border: 2px solid #444; cursor: pointer; }
  .swatches button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .cmd { display: flex; gap: .5rem; }
  .cmd code { flex: 1; padding: .6rem .75rem; background: #222; border-radius: 6px;
              font: .95rem ui-monospace, Menlo, monospace; overflow-x: auto; white-space: nowrap; }
  button.copy { padding: 0 1rem; border-radius: 6px; border: 0; background: #eee; color: #111;
                font-weight: 600; cursor: pointer; }
  .hint { color: #999; font-size: .875rem; margin-top: .75rem; }
</style>
</head>
<body>
<h1>spotify-now color</h1>
<p class="sub">Pick a color, copy the command, paste it into your terminal.</p>

<div class="row">
  <input type="color" id="picker" value="#1db954" aria-label="Pick a color">
  <input type="text" id="hex" value="#1db954" maxlength="7" spellcheck="false" aria-label="Hex color">
</div>

<div class="preview" aria-label="Preview">
  <span class="pill" id="pill">⣶⣤ ♪ Artist - Title</span>
</div>

<div class="swatches" id="swatches"></div>

<div class="cmd">
  <code id="cmd">spotify-now-color '#1db954'</code>
  <button class="copy" id="copy" type="button">Copy</button>
</div>
<p class="hint">Run it in a zsh session with the plugin loaded. The color is saved and applies to the next prompt redraw.</p>

<script>
(function () {
  var picker = document.getElementById('picker');
  var hexInput = document.getElementById('hex');
  var pill = document.getElementById('pill');
  var cmd = document.getElementById('cmd');
  var copy = document.getElementById('copy');
  var HEX = /^#?[0-9a-f]{6}$/i;

  // Same rule as the plugin: perceived brightness picks black or white text.
  function textFor(hex) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return (r * 299 + g * 587 + b * 114) / 1000 > 100 ? '#000000' : '#ffffff';
  }

  function apply(value) {
    var hex = '#' + value.replace('#', '').toLowerCase();
    pill.style.background = hex;
    pill.style.color = textFor(hex);
    picker.value = hex;
    hexInput.value = hex;
    hexInput.classList.remove('bad');
    cmd.textContent = "spotify-now-color '" + hex + "'";
    history.replaceState(null, '', '#' + hex.slice(1));
  }

  picker.addEventListener('input', function () { apply(picker.value); });
  hexInput.addEventListener('input', function () {
    if (HEX.test(hexInput.value)) { apply(hexInput.value); }
    else { hexInput.classList.add('bad'); }
  });

  ['#1db954', '#ff5f87', '#af87ff', '#5fafff', '#ffaf00', '#ff5f5f', '#5fd7d7', '#eeeeee']
    .forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.style.background = c;
      b.setAttribute('aria-label', 'Use ' + c);
      b.addEventListener('click', function () { apply(c); });
      document.getElementById('swatches').appendChild(b);
    });

  copy.addEventListener('click', function () {
    var text = cmd.textContent;
    function done() { copy.textContent = 'Copied'; setTimeout(function () { copy.textContent = 'Copy'; }, 1200); }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
    function fallback() {
      var t = document.createElement('textarea');
      t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(t);
    }
  });

  // Start from the color passed in the URL hash (the plugin sends the current one).
  var start = location.hash.slice(1);
  if (HEX.test(start)) { apply(start); } else { apply('#1db954'); }
})();
</script>
</body>
</html>
